# XcodeGen 用。`brew install xcodegen && xcodegen` で PersonRetouch.xcodeproj を生成する。
# 前提: FxPlug SDK (https://developer.apple.com/final-cut-pro/) が /Library/Developer/Frameworks にあること。
name: PersonRetouch
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # ヘッダー等のビルド用は SDK 側、実行時の本体は /Library/Developer/Frameworks にある
    FRAMEWORK_SEARCH_PATHS:
      - /Library/Developer/SDKs/FxPlug.sdk/Library/Frameworks
      - /Library/Developer/Frameworks
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: ここに自分の Team ID
targets:
  PersonRetouch:                      # 入れ物アプリ
    type: application
    platform: macOS
    sources: [Wrapper]
    settings:
      base:
        INFOPLIST_FILE: Wrapper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PersonRetouch
    dependencies:
      - target: PersonRetouchPlugIn
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/XPCServices
  PersonRetouchPlugIn:                # 本体 (XPC サービス)
    type: xpc-service
    platform: macOS
    sources:
      - Plugin
      - Shared
    settings:
      base:
        INFOPLIST_FILE: Plugin/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PersonRetouch.PlugIn
        SWIFT_OBJC_BRIDGING_HEADER: Plugin/Plugin-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["-framework", "FxPlug"]
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks", "@loader_path/../Frameworks"]
    dependencies:
      - framework: /Library/Developer/Frameworks/FxPlug.framework   # 実行時の本体を同梱(リンクは上の OTHER_LDFLAGS)
        embed: true
        link: false
      - sdk: Metal.framework
      - sdk: Vision.framework
